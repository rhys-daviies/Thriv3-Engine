# Cloudflare Pages project: serves the generated athlete profile pages AND the
# event collector from one origin.
#
# Same-origin is the point. The tracker posts to a relative /api/track, so
# there is no cross-origin preflight and no chance of a CORS mismatch silently
# swallowing events — the failure the roadmap warns about most.
name = "thriv3-profiles"
compatibility_date = "2026-08-01"
# The DEFAULT output directory, used when nothing else is named.
#
# Publishing always passes an explicit absolute directory to
# `wrangler pages deploy`, because in production the generated site lives on
# the persistent disk (THRIV3_BUILD_DIR=/data/profiles), not here. Which of the
# two wins if they disagree is wrangler's business and is not verifiable from
# this repository — but the failure is safe either way: `build/` is gitignored
# and nothing on Render writes build/public, so a wrangler that preferred this
# setting would fail on a missing directory rather than quietly deploying an
# empty site over the live one.
pages_build_output_dir = "build/public"

# Events land here. The local app pulls them down and resolves each token to a
# coach on that machine — the edge never holds coach or athlete identity.
[[d1_databases]]
binding = "DB"
database_name = "thriv3-engagement"
database_id = "29ac16ae-9e17-41bd-822a-c54d41a0bd72"

# THRIV3_SYNC_SECRET is a secret, not a var:
#   npx wrangler pages secret put THRIV3_SYNC_SECRET
