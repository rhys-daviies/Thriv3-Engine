# DI-04: checks that guard the correction-authorisation trust root. Make "correction-security" a REQUIRED status
# check on `main` (docs/CORRECTION_REVIEWER_SECURITY.md) — this file alone enforces nothing until that is set.
name: correction-security
# Forks, not worker threads: better-sqlite3 (native) aborts in vitest worker threads on the Linux runner
# ("Assertion failed: (env) != nullptr"), which is an environment fault, not a test result.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  correction-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RECRUITMATCH_DB: ':memory:'
    steps:
      # DI-07 (DI-06 INFO-5): actions pinned to commit SHAs (resolved from the v4 tags with `gh api`, 2026-10-10)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # DI-07 (DI-06 MINOR-7): the attestation suites need openssl; fail here rather than let them skip silently
      # (correctionTestKit.hasOpenssl() also throws under CI=true)
      - name: openssl is available for the attestation suites
        run: openssl version
      - name: Committed reviewer registry is version 3 and every runtime-scope key carries an attestation
        run: |
          node -e "
          const r = require('./shared/correctionReviewers.json');
          if (r.version !== 3) throw new Error('reviewer registry must be version 3');
          for (const x of r.reviewers) if (x.scopes.some((s) => s !== 'DISPOSABLE') && x.keys.length && !x.keys.every((k) => typeof k === 'object' && k.attestation && k.challenge))
            throw new Error(x.reviewer_id + ': a runtime-scope key must carry attestation + challenge');
          console.log('registry ok');"
      - name: Correction engine, reviewer security, privacy and mutation-safety tests
        run: >-
          npx vitest run --pool=forks
          server/lib/refresh
          server/db
          server/lib/emailPublication.test.js
          server/lib/programmeContactsIsolation.test.js
          server/scripts/committedPiiScan.test.js
          server/scripts/mutationPathSafety.test.js
