# Render blueprint for the internal Thriv3 operator application — Phase 13K.
#
# DEPLOYED. This file is the deployment contract for the running service;
# docs/hosting.md is the runbook that uses it. It said NOT DEPLOYED while the
# blueprint was still under review, and stayed wrong after provisioning —
# a comment claiming nothing is running is worse than none at all when
# something is.
#
# WHY RENDER. The service needs a long-lived Node process, a persistent disk
# for both the SQLite database and the generated report artefacts, and exactly
# one instance against that disk. Render enforces the last of those rather than
# leaving it to a comment: a service with a disk attached cannot be scaled to
# more than one instance, and a deploy stops the old instance before starting
# the new one instead of overlapping them. For SQLite in WAL mode that is not a
# limitation, it is the requirement — two processes writing one database file
# through a network filesystem is the failure mode this avoids by construction.
#
# The cost is a few seconds of downtime per deploy, for a tool with one
# operator, which is the right trade.

services:
  - type: web
    name: thriv3-operator
    runtime: node
    # 1 CPU / 2 GB. Spec-based ID, which Render introduced in August 2026;
    # the legacy name `standard` is still accepted but reads as a tier rather
    # than a size, and this file previously said `starter` — 0.5 CPU / 512 MB,
    # the plan 13K's own measurements ruled out. 389 MB resident with both
    # benchmark pools plus a 64 MiB scrypt spike per sign-in does not fit in
    # 512 MB, and an OOM kill mid-generation is a failed report.
    plan: 1c-2g
    region: ohio
    # The blueprint and the code it deploys come from ONE branch, and that
    # branch is now `main`.
    #
    # It said `release/internal-operator-hosting` for the reason that branch
    # existed: the corrected blueprint lived only there, so pointing the
    # Blueprint at main would have applied `plan: starter` and no upload path.
    # That reason is spent. `release/internal-operator-hosting` (c616e28) is a
    # strict ancestor of main — zero commits unique to it — so main now carries
    # both this file and every line the release branch ever deployed, and
    # keeping two branches was the drift trap rather than the protection
    # against one.
    #
    # Two things had to be true before this line could change, and both are:
    # THRIV3_MAILBOX_KEY is provisioned (main refuses to start without it, and
    # it is the only runtime prerequisite main adds), and a verified backup of
    # /data exists off the volume.
    branch: main
    # The client bundle and the server share one process, so the app and its
    # API are one origin: no CORS in production, and a session cookie that is
    # never cross-site.
    #
    # THREE STEPS, AND EACH ONE IS THERE FOR A REASON.
    #
    # `--include=dev` because NODE_ENV=production is set below and applies to
    # the build stage as well as the runtime, and npm resolves `omit=dev` from
    # it — so a plain `npm ci` installs no devDependencies and the build dies on
    # `vite: not found`. Vite is a build tool and belongs in devDependencies;
    # the fix is to ask for them here, not to move five packages into runtime
    # dependencies to make the error go away. Five are needed, not one: vite,
    # @vitejs/plugin-react, tailwindcss, postcss and autoprefixer. Vite is
    # simply the first one reached.
    #
    # `npm prune --omit=dev` afterwards because the built output is all the
    # runtime needs — it never runs Vite — and leaving the toolchain in the
    # container would put esbuild and Vite on the production disk, which is
    # exactly what docs/hosting.md says is not deployed. Verified: the prune
    # removes 211 packages, keeps express/helmet/better-sqlite3/pdfkit, leaves
    # dist/ intact and leaves the native binding loadable.
    #
    # `npm install --no-save wrangler` LAST, and only wrangler. Publishing a
    # profile is a Cloudflare Pages deployment, and wrangler is the supported
    # way to make one; without it the Go Live button could not work once
    # hosted, which is what it did until this line existed.
    #
    # Not a package.json dependency, and that is the point of doing it here.
    # Installing it as one pulls 226 MB — 145 MB of that workerd, a local dev
    # runtime a deploy never executes — and drags @esbuild back in, which is
    # exactly what the prune above removes. As a `--no-save` install after the
    # prune the exception is one reviewable line in the deployment contract
    # rather than a silent entry in a dependency list, and the app's own
    # dependency model is untouched.
    #
    # Pinned. An unpinned deploy tool is a deploy that changes behaviour on a
    # day nobody chose.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev && npm install --no-save --no-audit --no-fund --omit=dev wrangler@4.130.0
    startCommand: node server/index.js
    healthCheckPath: /healthz

    disk:
      name: thriv3-data
      mountPath: /data
      sizeGB: 5

    envVars:
      - key: NODE_ENV
        value: production
      # 0.0.0.0 deliberately, and only safe because every /api route below the
      # authentication boundary requires a session — see server/index.js.
      - key: API_HOST
        value: 0.0.0.0
      # Render terminates TLS one hop in front of the process. Without this
      # Express sees plain http and refuses to set a Secure cookie, and sign-in
      # fails with no visible error.
      - key: THRIV3_TRUST_PROXY
        value: 1
      # Both on the persistent disk, and on the SAME disk: one snapshot then
      # captures the history rows and the artefacts they point at together.
      - key: RECRUITMATCH_DB
        value: /data/recruitmatch.sqlite
      - key: THRIV3_REPORT_STORE
        value: /data/reports
      # THE THIRD PERSISTENT PATH. Added to runtimeConfig after this file was
      # first written, and missing here until 13L: `players.recommendations`
      # holds a PATH into this directory, so without it every athlete's stored
      # matching analysis is on the container filesystem and is discarded on
      # the next deploy. Startup refuses to run without it, which is the gate
      # doing its job — but the blueprint has to be right.
      - key: THRIV3_UPLOAD_DIR
        value: /data/uploads
      - key: THRIV3_CLIENT_DIR
        value: dist
      # Generated at provision time and stored by Render, never in this file.
      - key: THRIV3_SESSION_SECRET
        generateValue: true
      # The service's own public origin — the CORS allow-list and the CSRF
      # origin check, and required at startup.
      #
      # `sync: false` meant "ask the operator", but the Render service UI does
      # not expose an Environment section for a Blueprint-managed variable, so
      # there was nowhere to answer. The runtime refused to start and said
      # exactly why, which is the gate working; the fix is to put the value
      # where the blueprint can carry it. Not a secret — it is the public
      # address of the service.
      #
      # Change this when a custom domain replaces the onrender.com address, or
      # sign-in will be refused on origin.
      - key: THRIV3_APP_ORIGIN
        value: https://thriv3-operator.onrender.com
      # THE MAILBOX ENCRYPTION KEY — D2. Base64 of exactly 32 random bytes.
      #
      # `sync: false` AND NOT `generateValue: true`, which is the opposite of
      # THRIV3_SESSION_SECRET above and is deliberate.
      #
      # Render's generated value is a random string it chooses the alphabet and
      # length of. The session secret does not care: it is fed to HMAC, which
      # accepts any length, so "some long random string" is exactly right there.
      # This key is different — it is an AES-256 key, and AES-256 takes 32
      # bytes and nothing else. A generated value that happens not to decode
      # from base64 to exactly 32 bytes is not a weaker key, it is not a key,
      # and the runtime refuses to start rather than accept one.
      #
      # Bending the contract to fit the platform was the alternative: hash
      # whatever Render generates down to 32 bytes and call it derived. That
      # turns an unknown-entropy string into a key of unknown strength while
      # looking rigorous, and nothing downstream could tell. So the key is
      # provisioned by hand, once, and the startup check is what makes a
      # mistake loud:
      #
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      #
      # Paste the result into the Render dashboard when the blueprint first
      # applies. Losing it means every connected mailbox must be reconnected —
      # no credential is readable without it — so it belongs in the same place
      # as the database backups, not only in the dashboard.
      - key: THRIV3_MAILBOX_KEY
        sync: false
      # Existing application secrets, unchanged and never in git.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: THRIV3_SENDER_IDENTITY
        sync: false
      - key: THRIV3_POSTAL_ADDRESS
        sync: false
      - key: THRIV3_SYNC_SECRET
        sync: false
      - key: THRIV3_PUBLIC_BASE_URL
        sync: false
      # THE FOURTH PERSISTENT PATH — generated athlete pages.
      #
      # Same class of bug as THRIV3_UPLOAD_DIR above, and found by audit rather
      # than by an outage. Without it the pages are written inside the
      # container at build/public and discarded on the next deploy — and
      # `/p/:slug` answers a missing file with the neutral "this profile is no
      # longer shared" page. A coach opening yesterday's link would be told the
      # athlete had been withdrawn. Startup refuses to run without it.
      - key: THRIV3_BUILD_DIR
        value: /data/profiles
      # WHERE THE GENERATED PAGES POST THEIR EVENTS.
      #
      # Defaults to http://localhost:8787/api/track, which in a coach's browser
      # means their own machine. The page looks perfect and reports nothing,
      # and the failure is invisible until somebody asks why a month of
      # outreach produced no engagement. Same origin as the pages themselves,
      # so no CORS preflight is involved.
      - key: THRIV3_TRACK_ENDPOINT
        value: https://thriv3-profiles.pages.dev/api/track
      # WHERE THE EDGE COLLECTOR LIVES, for the sync in the other direction.
      #
      # `isEdgeConfigured()` requires this AND THRIV3_SYNC_SECRET, so without
      # it the scheduler refuses to start and the manual button returns 400 —
      # regardless of the interval below.
      - key: THRIV3_EDGE_URL
        value: https://thriv3-profiles.pages.dev
      # DEPLOY CREDENTIALS FOR CLOUDFLARE PAGES. Declarations only; the values
      # are entered in the Render dashboard and never appear in git.
      #
      # The token needs exactly one permission — Account / Cloudflare Pages /
      # Edit — and should have no others: this token can deploy the public
      # athlete site, so its blast radius is worth keeping to that.
      #
      # The account id is required rather than optional. A token with access to
      # more than one account cannot infer which, and wrangler fails with a
      # message that reads like an authentication problem.
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      # ZERO FOR INITIAL HOSTED VALIDATION. 0 (like unset) means the edge sync
      # never runs by itself, and the boot log says so out loud rather than
      # leaving it ambiguous. Nothing should run unattended against the
      # Cloudflare edge until the deployment has been verified by hand. 15 is
      # the pilot cadence to restore afterwards.
      - key: THRIV3_SYNC_INTERVAL_MINUTES
        value: 0
